<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Amazon Rewards Collector</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --text: #111827;
        --text-muted: #6b7280;
        --card-bg: #f9fafb;
        --border: #e5e7eb;
        --btn-bg: #ff9900;
        --btn-hover: #e68a00;
        --btn-text: #111827;
        --btn-disabled-bg: #e5e7eb;
        --btn-disabled-text: #9ca3af;
        --progress-track: #e5e7eb;
        --progress-bar: #ff9900;
        --link: #007185;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f172a;
          --text: #f8fafc;
          --text-muted: #94a3b8;
          --card-bg: #1e293b;
          --border: #334155;
          --btn-bg: #f59e0b;
          --btn-hover: #d97706;
          --btn-text: #0f172a;
          --btn-disabled-bg: #334155;
          --btn-disabled-text: #64748b;
          --progress-track: #334155;
          --progress-bar: #f59e0b;
          --link: #38bdf8;
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        width: 240px;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        transition: background-color 0.2s ease, color 0.2s ease;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 14px;
      }

      .logo-icon {
        width: 24px;
        height: 24px;
        background: linear-gradient(135deg, #ff9900, #ffb84d);
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: 800;
        color: #131921;
      }

      h3 {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      button {
        background-color: var(--btn-bg);
        color: var(--btn-text);
        border: none;
        padding: 10px;
        width: 100%;
        cursor: pointer;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 600;
        transition: background-color 0.15s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }

      button:hover:not(:disabled) {
        background-color: var(--btn-hover);
      }

      button:disabled {
        background-color: var(--btn-disabled-bg);
        color: var(--btn-disabled-text);
        cursor: not-allowed;
      }

      .progress-container {
        margin-top: 12px;
        background-color: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 10px;
      }

      .progress-meta {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--text-muted);
        margin-bottom: 6px;
        font-weight: 600;
      }

      .progress-track {
        height: 6px;
        background-color: var(--progress-track);
        border-radius: 3px;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        background-color: var(--progress-bar);
        border-radius: 3px;
        width: 0%;
        transition: width 0.3s ease;
      }

      .status {
        margin-top: 10px;
        font-size: 12px;
        color: var(--text-muted);
        line-height: 1.4;
      }

      .footer-link {
        margin-top: 14px;
        padding-top: 10px;
        border-top: 1px solid var(--border);
        text-align: center;
      }

      .footer-link a {
        color: var(--link);
        font-size: 12px;
        text-decoration: none;
        font-weight: 500;
      }

      .footer-link a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="logo-icon">✓</div>
      <h3>Rewards Collector</h3>
    </div>

    <button id="startBtn">Start</button>
    <button id="stopBtn" style="display: none; margin-top: 8px; background-color: #ef4444; color: #ffffff;">Stop</button>

    <div id="progressBox" class="progress-container" style="display: none;">
      <div class="progress-meta">
        <span id="progressLabel">Collecting...</span>
        <span id="progressFraction">0 / 0</span>
      </div>
      <div class="progress-track">
        <div id="progressBar" class="progress-fill"></div>
      </div>
    </div>

    <div id="status" class="status">Click Start to collect all available rewards</div>

    <div class="footer-link">
      <a href="#" id="viewSummaryLink">View Summary Page &rarr;</a>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
